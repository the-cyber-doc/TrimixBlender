# Trimix Blender: nginx serving the static app (plain HTTP on 8080, behind your TLS proxy).
# __BASE__ is replaced by the image's BASE_PATH build argument ('' or e.g. /blender).
#   /srv/www__BASE__/   the SvelteKit build (.gz next to each file)
#   /tmp                pid and temporary files (tmpfs: the rest is read-only)
# Every add_header is set once, in the server block: a location with its own would drop them all.

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json  webmanifest;
    }

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server_tokens off;
    keepalive_timeout 65;
    sendfile   on;
    tcp_nopush on;

    # Only precompressed files (adapter-static's .gz), never at request time.
    gzip        off;
    gzip_static on;
    gzip_vary   on;

    charset       utf-8;
    charset_types text/css text/plain application/javascript application/manifest+json image/svg+xml;

    # The client's address from the proxy (private addresses only).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive off;

    map $request_uri $request_path {
        ~^(?<p>[^?]*)  $p;
    }
    log_format blender '$remote_addr [$time_iso8601] "$request_method $request_path $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time ua="$http_user_agent"';
    access_log /dev/stdout blender;

    map $uri $cache_control {
        # Hashed build files: cache forever.
        ~^__BASE__/_app/immutable/  "public, max-age=31536000, immutable";
        # Everything else (index.html, service-worker.js, manifest, icons):
        # always revalidated, or users get stuck on an old version.
        default                     "no-cache";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/www;
        absolute_redirect off;

        add_header Cache-Control                $cache_control always;
        add_header Referrer-Policy              "no-referrer" always;
        add_header X-Content-Type-Options       "nosniff" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
        # Scripts: also limited by the page's <meta> policy (the hash of SvelteKit's boot script);
        # both apply. Styles inline: Svelte's style: directives.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Single-page app: any other path gets the shell.
        location __BASE__/ {
            try_files $uri $uri/index.html __BASE__/index.html;
        }
    }
}
