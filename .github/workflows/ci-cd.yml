name: CI/CD Pipeline

# Every push (any branch) and every PR: type checks, lint, unit tests (100 % coverage),
# the build, the browser tests, and the Docker image built for amd64 and arm64 (not
# published). A version tag (v1.2.3) also:
#   - publishes the image to Docker Hub, both architectures under one tag:
#     <user>/trimix-blender:1.2.3, :1.2, :1 and :latest;
#   - creates the GitHub release, with the web build attached (to serve as is with any
#     web server), the signed Android app (APK, and the AAB for Google Play), the signed iOS
#     app (IPA, for App Store Connect / TestFlight), and the links to that release's images.
# The Android and iOS apps (capacitor.config.ts) are built on every push too: the APK is
# checked for permissions and trackers (none allowed: tools/check-android-apk.sh).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub, also for the dhi.io base images).
# Signing the apps (see the README), required for a release, optional otherwise:
#   Android: ANDROID_KEYSTORE_BASE64 (the .jks, base64), ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them (not a release): unsigned.
#   iOS: APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#     APP_STORE_CONNECT_API_KEY_BASE64 (the .p8, base64): Xcode's automatic signing, its
#     certificate and profile managed by Apple. Not a release: an unsigned build only.
# Actions pinned by commit (a tag can be moved), the version in a comment; Dependabot
# updates them (.github/dependabot.yml).
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  # A rehearsal of a release's apps, from any branch (Actions > CI/CD Pipeline > Run workflow,
  # or `gh workflow run ci-cd.yml --ref <branch> -f sign=true`): the Android and iOS apps
  # signed as for a release, as the run's artifacts. Nothing is published.
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Android and iOS apps (needs the signing secrets)
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: docker.io
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # Signed apps required: a release, or a manual run with "sign".
  SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign == true }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26' # as the Docker build stage (dhi.io/node:26)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint and format (ESLint, Prettier)
        run: npm run lint

      # With coverage: below its floors (100 %, vite.config.ts) the step fails.
      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        env:
          # Shown on the About page: the release tag ("v" removed by the build), the commit.
          APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          APP_COMMIT: ${{ github.sha }}
        run: npm run build

      # The web build, attached to the release on a tag (job "release").
      - name: Upload web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-build
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Pages, phone layout, offline service worker, update banner (playwright.config.ts,
      # which builds the app again and serves it with `vite preview`).
      - name: Browser tests
        run: npm run test:browser

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  android:
    needs: test
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm

      # Capacitor 8 builds with Java 21. The Android SDK is on the runner ($ANDROID_HOME).
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # build-native/, copied into android/ (and ios/) by `cap sync`.
      - name: Build the web app for the native apps
        env:
          APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          APP_COMMIT: ${{ github.sha }}
        run: npm run build:native

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$SIGN" = true ]; then
            echo "::error::Signing needs the ANDROID_KEYSTORE_BASE64 secret (and its passwords): see the README."
            exit 1
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK and AAB are unsigned (not a release)."
          fi

      # versionName and versionCode from the tag (android/app/build.gradle).
      - name: Build the APK and the AAB
        working-directory: android
        env:
          APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect the APK and the AAB
        run: |
          mkdir -p android-app
          cp android/app/build/outputs/apk/release/*.apk android-app/trimix-blender.apk
          cp android/app/build/outputs/bundle/release/*.aab android-app/trimix-blender.aab
          rm -f "$RUNNER_TEMP/release.jks"

      - name: No permission, no tracker
        run: tools/check-android-apk.sh android-app/trimix-blender.apk

      # Signed by Gradle (apksig, apksigner's library): checked with apksigner itself (APK
      # signature schemes v1 to v3) and jarsigner (the AAB's signature, what Google Play reads).
      - name: Verify the signatures
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs android-app/trimix-blender.apk
          # (Not -strict: an Android key's certificate is self-signed, which -strict rejects.)
          jarsigner -verify android-app/trimix-blender.aab | grep -x 'jar verified.'

      - name: Upload the Android app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-app
          path: android-app
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: test
    name: iOS app
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app for the native apps
        env:
          APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          APP_COMMIT: ${{ github.sha }}
        run: npm run build:native

      # Version: the tag; build number: the same as Android's versionCode (1.2.3 → 10203).
      - name: Version
        env:
          APP_VERSION: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
        run: |
          version="${APP_VERSION#v}"
          case "$version" in *.*.*) ;; *) version=0.0.0 ;; esac
          IFS=. read -r major minor patch <<< "$version"
          build=$((major * 10000 + minor * 100 + patch)); [ "$build" -gt 0 ] || build=1
          echo "IOS_VERSION=$version" >> "$GITHUB_ENV"
          echo "IOS_BUILD=$build" >> "$GITHUB_ENV"

      # Not signing: unsigned, it proves the app builds.
      - name: Build the app (unsigned)
        if: env.SIGN != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$IOS_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD" build
          mkdir -p ios-app/Payload
          cp -R "$RUNNER_TEMP/ios/Build/Products/Release-iphoneos/App.app" ios-app/Payload/
          (cd ios-app && zip -qr trimix-blender-unsigned.ipa Payload && rm -rf Payload)

      # A release (or a manual signed run): archived and exported signed for App Store Connect
      # (TestFlight, the App Store). Automatic signing with the App Store Connect API key: Xcode gets the
      # distribution certificate and the profile from Apple (cloud signing), no file to keep.
      - name: Build and sign the app
        if: env.SIGN == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY" ]; then
            echo "::error::Signing needs APPLE_TEAM_ID and the APP_STORE_CONNECT_* secrets: see the README."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$API_KEY" | base64 -d > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION="$IOS_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key"
          mkdir -p ios-app
          cp "$RUNNER_TEMP"/export/*.ipa ios-app/trimix-blender.ipa
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"

      - name: Upload the iOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-app
          path: ios-app
          if-no-files-found: error
          retention-days: 7

  build:
    needs: test
    name: Image (${{ matrix.platform }})
    permissions:
      contents: read

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      # Secrets are not available to PRs from forks: fall back to a local name (never pushed).
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/trimix-blender

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The base images come from Docker Hardened Images (dhi.io): pulling them needs a
      # Docker account, on every build. Not available to pull requests from forks.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.RELEASE == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Release: push by digest (tagged in merge-and-push). Otherwise: build only. The
      # Dockerfile runs the unit tests again on each architecture before building.
      - name: Build (and push by digest on release)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.RELEASE == 'true' && github.ref_name || '' }}
            APP_COMMIT=${{ github.sha }}
          outputs: ${{ env.RELEASE == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          # Releases: an SPDX SBOM and the SLSA build provenance, attached to the image.
          sbom: ${{ env.RELEASE == 'true' }}
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || 'false' }}

      - name: Export digest
        if: env.RELEASE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-and-push:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish to Docker Hub
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/trimix-blender
    # (No image name here: an output holding a secret, the user name, is dropped by GitHub.)
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.inspect.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, 1, latest
      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # The multi-architecture image's digest, for the release notes (pull by digest).
      - name: Inspect image
        id: inspect
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{ json .Manifest }}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

  release:
    needs: [test, android, ios, merge-and-push]
    if: startsWith(github.ref, 'refs/tags/v')
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files

    steps:
      - name: Download web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-build
          path: trimix-blender

      - name: Download the Android app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-app
          path: android-app

      - name: Download the iOS app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-app
          path: ios-app

      # The static site, to copy as is into any folder of any web server (relative URLs, hash
      # routing: see the README). Archives and their checksums.
      - name: Package the web build
        env:
          VERSION: ${{ needs.merge-and-push.outputs.version }}
        run: |
          name="trimix-blender-${VERSION}-web"
          tar -czf "$name.tar.gz" trimix-blender
          zip -qr "$name.zip" trimix-blender
          mv android-app/trimix-blender.apk "trimix-blender-${VERSION}.apk"
          mv android-app/trimix-blender.aab "trimix-blender-${VERSION}.aab"
          mv ios-app/trimix-blender.ipa "trimix-blender-${VERSION}.ipa"
          sha256sum "$name.tar.gz" "$name.zip" trimix-blender-"${VERSION}".apk trimix-blender-"${VERSION}".aab \
            trimix-blender-"${VERSION}".ipa > SHA256SUMS

      - name: Release notes
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/trimix-blender
          VERSION: ${{ needs.merge-and-push.outputs.version }}
          DIGEST: ${{ needs.merge-and-push.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          ## Docker image (linux/amd64, linux/arm64)

          - Docker Hub: https://hub.docker.com/r/${IMAGE}/tags?name=${VERSION}
          - \`docker pull ${IMAGE}:${VERSION}\`
          - By digest: \`docker pull ${IMAGE}@${DIGEST}\`

          Plain HTTP on port 8080, for your TLS reverse proxy (see the README).

          ## Android and iOS apps

          Self-contained (the whole app is inside, it never uses the network), no permission, no tracker.

          - \`trimix-blender-${VERSION}.apk\`: Android 7+, signed, to install directly. \`.aab\`: for Google Play.
          - \`trimix-blender-${VERSION}.ipa\`: iOS 15+, signed for App Store Connect (TestFlight, the App Store).

          ## Web build

          \`trimix-blender-${VERSION}-web.tar.gz\` / \`.zip\` (folder \`trimix-blender/\`): the static app, to serve as is
          in any folder of any web server: no configuration, no rewrite rule.
          Checksums in \`SHA256SUMS\`.
          NOTES

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.merge-and-push.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Trimix Blender $VERSION" \
            --notes-file notes.md --generate-notes \
            "trimix-blender-${VERSION}-web.tar.gz" "trimix-blender-${VERSION}-web.zip" \
            "trimix-blender-${VERSION}.apk" "trimix-blender-${VERSION}.aab" \
            "trimix-blender-${VERSION}.ipa" SHA256SUMS
