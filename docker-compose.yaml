# Trimix Blender behind your TLS reverse proxy: http://127.0.0.1:8080/
#   docker compose up -d --build        (or tools/docker-dev.sh)
# Environment: BLENDER_PORT (default 8080), BASE_PATH (default '': the domain's root,
# e.g. /blender), APP_VERSION and APP_COMMIT (the About page).
services:
  blender:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-}
        APP_VERSION: ${APP_VERSION:-}
        APP_COMMIT: ${APP_COMMIT:-unknown}
    image: trimix-blender
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BLENDER_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No shell or HTTP client in the hardened image: point your proxy's health check at /health.
